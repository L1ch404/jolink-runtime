[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "jolink-runtime"
version = "0.1.0a3"
description = "Local runtime evidence and debugging for coding agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "joLink contributors" }]
dependencies = [
  "anyio==4.14.2",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mcp==1.28.1",
  "psutil==7.2.2",
]

[project.scripts]
jolink-runtime = "jolink_runtime.transport.stdio:main"

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "mcp_java_e2e: real stdio MCP and JVM safety tests (canonical CI environment only)",
]
