name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            java: "8"
          - os: ubuntu-latest
            python: "3.11"
            java: "17"
          - os: ubuntu-latest
            python: "3.13"
            java: "17"
          - os: ubuntu-latest
            python: "3.11"
            java: "21"
          - os: windows-latest
            python: "3.11"
            java: "8"
          - os: windows-latest
            python: "3.11"
            java: "17"
          - os: macos-latest
            python: "3.11"
            java: "17"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Verify frozen Runtime lineage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11' && matrix.java == '17'
        run: uv run pytest -q tests/contract/test_runtime_lineage_golden.py
      - name: Run portable test suite
        run: uv run pytest -m "not mcp_java_e2e"
      - name: Run real MCP/JVM safety E2E
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11' && matrix.java == '17'
        env:
          JOLINK_RUN_MCP_JAVA_E2E: "1"
        run: uv run pytest -m mcp_java_e2e tests/e2e/test_stdio_mcp_java.py
      - run: uv build --wheel
