name: Publish prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and sdist without workspace sources
        run: uv build --no-sources --clear
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            scripts/verify_distribution.py

  verify-windows:
    name: Clean Windows MCP/JVM release E2E
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: release
      - name: Verify installed wheel and sdist without a source checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseRoot = (Resolve-Path "release").Path
          $wheel = (Get-ChildItem "release/dist/*.whl").FullName
          $sdist = (Get-ChildItem "release/dist/*.tar.gz").FullName
          foreach ($artifact in @($wheel, $sdist)) {
            $kind = if ($artifact.EndsWith(".whl")) { "wheel" } else { "sdist" }
            $environment = Join-Path $env:RUNNER_TEMP "jolink-$kind"
            uv venv $environment --python 3.11
            $python = Join-Path $environment "Scripts/python.exe"
            $server = Join-Path $environment "Scripts/jolink-runtime-debugger.exe"
            uv pip install --python $python $artifact
            & $python "release/scripts/verify_distribution.py" `
              --server $server `
              --expected-source-root $releaseRoot `
              --expected-version "0.1.0a1"
          }

  publish:
    name: Publish 0.1.0a1 to PyPI
    needs: verify-windows
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: release
      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always release/dist/*
